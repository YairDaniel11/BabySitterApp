# JVM שמשמש להרצת Gradle עצמו (לא קשור ל-minSdk של האפליקציה)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# הפרויקט לא משתמש ב-AndroidX/AppCompat בכלל (ראו הערה ב-app/build.gradle) -
# חשוב להשאיר את זה false, אחרת חלק מהכלים ינסו להוסיף תלויות AndroidX.
android.useAndroidX=false
android.enableJetifier=false
