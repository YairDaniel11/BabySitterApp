apply plugin: 'com.android.application'

android {
    namespace 'com.babysitter.app'
    // הועלה מ-33 ל-34: נדרש כדי שנוכל להעלות גם את targetSdk (ראו הסבר שם) -
    // compileSdk תמיד חייב להיות >= targetSdk.
    compileSdk 34

    defaultConfig {
        applicationId "com.babysitter.app"
        // minSdk 19 = Android 4.4 KitKat, כדי לתמוך גם במכשירי שיאומי ישנים (מקשים) -
        // זה לא משתנה, זה מה שמאפשר למכשיר הישן להמשיך לעבוד.
        minSdk 19

        // *** שינוי מרכזי (סעיפים ג/ו/ז בבקשת השיפור) ***
        // בעבר targetSdk היה זהה ל-minSdk (19). זה בדיוק מה שגרם לשלוש התופעות:
        // 1. הדיאלוג "האפליקציה נבנתה לגרסה ישנה של אנדרואיד ועלולה שלא לעבוד
        //    כראוי" - אנדרואיד מציג אותו אוטומטית (מגרסה 6 ואילך) לכל אפליקציה
        //    עם targetSdk מתחת ל-23, בלי קשר לגרסת אנדרואיד בפועל של המכשיר.
        // 2. כשה-targetSdk נמוך, המערכת מפעילה מודל הרשאות "ישן" (כל ההרשאות
        //    ב-manifest מאושרות אוטומטית בהתקנה) - זה עבד "במקרה" בעבר, אבל
        //    לפי דיווחי המשתמשים במכשירים חדשים, זה לא תמיד עקבי בין יצרנים/
        //    גרסאות, ובגללו גם לא הייתה בקשת הרשאות מפורשת ומבוקרת. עכשיו,
        //    עם targetSdk 34, אנדרואיד עובר למודל ההרשאות ה"רגיל" (runtime) -
        //    וקוד האפליקציה (MainActivity/SettingsActivity) מבקש את ההרשאות
        //    באופן יזום ומפורש לפני הפעלה, כדי שלא תהיה תלות בהתנהגות מרומזת.
        // 3. חלק מהתנהגויות השמע/שיחה החדשות יותר (למשל setSpeakerphoneOn
        //    שהופך פחות אמין החל מאנדרואיד 9-12) מטופלות עכשיו בקוד עם ה-API
        //    העדכני (AudioManager.setCommunicationDevice למכשירי אנדרואיד 12+),
        //    שדורש בכל מקרה targetSdk/compileSdk עדכניים כדי להתקמפל.
        targetSdk 34

        versionCode 1
        versionName "1.0"
        // versionCode/versionName הראשוניים כאן הם רק ברירת מחדל לבנייה מקומית.
        // בפייפליין ב-.github/workflows/build.yml, שלב חדש מחליף את versionCode
        // (ואת versionName) בערך שמבוסס על מספר ההרצה של GitHub Actions לפני
        // ה-build בפועל - כך שכל APK שיוצא מה-CI מקבל אוטומטית מספר גרסה חדש
        // ועולה, בלי שצריך לזכור לעדכן אותו ידנית בקובץ הזה (סעיף ח').
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// הוסרו תלויות AndroidX/AppCompat: בדיקה של שתי אפליקציות אמיתיות שעובדות
// על מכשירי שיאומי מקשים (כולל אפליקציית ניהול ותיקה ומוכחת) העלתה ששתיהן
// נמנעות לגמרי מ-AndroidX ומשתמשות ב-Activity רגיל + ה-theme הגולמי של
// הפלטפורמה. זה גם מפשט את הבנייה (פחות תלויות להוריד מ-Maven).
// המסקנה הזו לא השתנתה - גם מסך ההגדרות החדש (SettingsActivity) ומנגנון
// שלושת ערכות הנושא (מערכת/בהיר/כהה) ממומשים בלי AndroidX, עם שני styles
// גולמיים (AppTheme.Dark/AppTheme.Light) ובחירה בין ה-2 בקוד לפי העדפת
// המשתמש/הגדרת המערכת - ראו הסבר מפורט ב-ThemeUtil.java.
